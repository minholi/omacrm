[project]
name = "omacrm"
version = "0.1.0"
description = "Metadata-driven Django CRM with a django-unfold admin, inspired by EspoCRM"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Marcelo Minholi", email = "minholi@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "croniter>=6.2.4",
    "cryptography>=50.0.1",
    "django>=5.2,<6.0",
    "django-constance>=4.3.5",
    "django-filter>=26.1",
    "django-hijack>=3.7.8",
    "django-import-export[openpyxl]>=4.4.1",
    "django-money>=3.6.1",
    "django-simple-history>=3.13.0",
    "django-unfold>=0.105",
    "djangoql>=0.19.1",
    "djangorestframework>=3.18.1",
    "openpyxl>=3.1.5",
    "phonenumbers>=9.0.39",
    "pillow>=12.3.0",
    "premailer>=3.10",
    "pygments>=2.21.0",
    "whitenoise>=6.12.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
server = [
    "gunicorn>=26.2.0",
]
