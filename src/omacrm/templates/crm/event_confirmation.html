<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Invitation</title>
    <style>
        body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
               background: #f5f5f5; color: #111827; display: flex;
               align-items: center; justify-content: center; min-height: 100vh;
               margin: 0; padding: 24px; }
        .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px;
                box-shadow: 0 1px 3px rgba(0,0,0,.08); max-width: 520px;
                padding: 32px; text-align: center; }
        h1 { font-size: 20px; margin: 0 0 12px; }
        p { margin: 0 0 8px; line-height: 1.5; color: #374151; }
        .status { display: inline-block; margin-top: 8px; padding: 4px 12px;
                  border-radius: 999px; font-size: 13px; font-weight: 600; }
        .accepted { background: #ecfdf5; color: #065f46; }
        .declined { background: #fef2f2; color: #991b1b; }
    </style>
</head>
<body>
    <div class="card">
        <h1>{{ event.name }}</h1>
        <p>{{ event.date_start|date:"Y-m-d H:i" }}{% if event.date_end %} – {{ event.date_end|date:"H:i" }}{% endif %}</p>
        <p>Hello {{ attendance.display_name }},</p>
        <p>Your response has been recorded.</p>
        <span class="status {% if accepted %}accepted{% else %}declined{% endif %}">
            {{ attendance.get_status_display }}
        </span>
    </div>
</body>
</html>
