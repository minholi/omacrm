{% extends "portal/base.html" %}

{% block title %}Change Password — OmaCRM Portal{% endblock %}

{% block content %}
    <h1>Change Password</h1>

    <div class="card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <p>
                <button class="primary" type="submit">Change password</button>
                <a class="muted" href="{% url 'portal:profile' %}">Back to profile</a>
            </p>
        </form>
    </div>
{% endblock %}
