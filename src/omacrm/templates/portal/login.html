<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in — OmaCRM Portal</title>
    <style>
        body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
               background: #f5f6f8; color: #111827; display: flex;
               align-items: center; justify-content: center; min-height: 100vh;
               margin: 0; padding: 24px; }
        .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px;
                padding: 32px; max-width: 380px; width: 100%;
                box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        h1 { font-size: 20px; margin: 0 0 20px; }
        label { display: block; font-size: 13px; margin-bottom: 4px; color: #374151; }
        input { width: 100%; padding: 8px 10px; border: 1px solid #d1d5db;
                border-radius: 6px; font-size: 14px; margin-bottom: 14px; }
        button { background: #7c3aed; color: #fff; border: 0; padding: 10px 14px;
                 border-radius: 6px; font-size: 14px; cursor: pointer; width: 100%; }
        .error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca;
                 padding: 8px 12px; border-radius: 6px; margin-bottom: 14px;
                 font-size: 13px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Sign in</h1>
        {% if form.errors %}
            <div class="error">Invalid user name or password.</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <label for="id_username">User name</label>
            <input type="text" name="username" id="id_username" autofocus required>
            <label for="id_password">Password</label>
            <input type="password" name="password" id="id_password" required>
            <button type="submit">Sign in</button>
        </form>
    </div>
</body>
</html>
